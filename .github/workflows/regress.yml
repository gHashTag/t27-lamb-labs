# Host-verifiable regression gates on every push/PR.
#
# Runs the same five gates as `bash scripts/regress_all.sh` (G1 portfolio
# acceptance, G2 spec-first compiler, G3 conformance pack, G4 manifest sweep,
# G5 tree drift). Board-side work (Vivado Tcl, Kria probes) is manual and
# intentionally not in CI.
#
# Note: G2/G4/G5 compare regenerated artifacts byte-for-byte against committed
# ones. The committed artifacts were produced with yosys 0.33; if the apt
# yosys on the runner ever diverges byte-wise, pin oss-cad-suite here instead.
name: regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FPGA toolchain (iverilog, yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys
          iverilog -V | head -1
          yosys -V

      - name: Run all acceptance gates (G1-G5)
        run: |
          OUT=/tmp/regress_ci.log bash scripts/regress_all.sh
          grep -E "G[0-9]+: (PASS|FAIL)|REGRESSION" /tmp/regress_ci.log
